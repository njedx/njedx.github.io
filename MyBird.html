<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You</title>

<style>
body{
    margin:0;
    height:100vh;
    background:#000;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}

/* ===== MICKEY ===== */
.mickey{
    position:relative;
    width:160px;
    height:160px;
    opacity:0;
    transform:scale(0.3);
    animation:appear 2.5s ease forwards;
}

/* glow effect */
.mickey::after{
    content:"";
    position:absolute;
    inset:-30px;
    background:radial-gradient(circle, rgba(255,255,0,0.35), transparent 60%),
                radial-gradient(circle, rgba(255,105,180,0.35), transparent 60%);
    filter:blur(20px);
    opacity:0;
    animation:glow 3s ease forwards 1.5s;
}

/* ears */
.ear{
    position:absolute;
    width:80px;
    height:80px;
    background:#111;
    border-radius:50%;
}

.left{ top:-35px; left:-35px; }
.right{ top:-35px; right:-35px; }

/* face */
.face{
    width:160px;
    height:160px;
    background:#111;
    border-radius:50%;
    position:absolute;
}

/* ===== ANIMATIONS ===== */
@keyframes appear{
    0%{
        opacity:0;
        transform:scale(0.3);
        filter:blur(10px);
    }
    60%{
        opacity:1;
        transform:scale(1.1);
        filter:blur(0px);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes glow{
    0%{ opacity:0; }
    100%{ opacity:1; }
}

/* ===== TEXT ===== */
.text{
    position:absolute;
    bottom:40px;
    width:80%;
    color:white;
    text-align:center;
    font-size:16px;
    line-height:1.6;
    opacity:0;
    animation:textIn 3s ease forwards 2s;
    text-shadow:0 0 10px rgba(255,255,255,0.3);
}

@keyframes textIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="mickey">
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face"></div>
</div>

<div class="text">
This page was built just to say: you’re truly one of a kind.<br><br>
Thank you for being the wonderful person you are,<br>
and I'm just really glad to have you by my side.
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at center, #0a0a16 0%, #000000 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center; 
    align-items: center;     
    font-family: 'Poppins', sans-serif;
    perspective: 1000px;
}


body::before, body::after {
    content: "";
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 20vw 10vh 2px rgba(255,182,193,0.5), 80vw 30vh 1px #fff, 50vw 70vh 3px rgba(255,255,0,0.4), 15vw 85vh 2px #fff, 85vw 80vh 1px rgba(255,182,193,0.3);
    animation: floatingDust 12s linear infinite;
    opacity: 0.6;
    z-index: 0;
}
body::after {
    box-shadow: 30vw 50vh 2px #fff, 70vw 15vh 3px rgba(255,255,0,0.3), 40vw 90vh 1px rgba(255,182,193,0.6), 90vw 60vh 2px #fff;
    animation-duration: 18s;
    animation-delay: -5s;
}

@keyframes floatingDust {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-100vh) rotate(360deg); }
}



.wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 1;
}


.mickey {
    position: relative;
    width: 140px;
    height: 140px;
    margin-bottom: 50px; /* يعطي مسافة ممتازة لرفعه فوق الكلام */
    opacity: 0;
    transform: scale(0.3);
    animation: appear 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, pulse 4s ease-in-out infinite 2.5s;
}

.mickey::after {
    content: "";
    position: absolute;
    inset: -40px;
    background: radial-gradient(circle, rgba(255,182,193,0.4) 0%, rgba(255,255,0,0.15) 40%, transparent 70%);
    filter: blur(15px);
    opacity: 0;
    animation: glow 3s ease forwards 1.2s;
    z-index: -1;
}

.ear, .face {
    background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
    border-radius: 50%;
    box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 5px 15px rgba(0,0,0,0.6);
}

.ear {
    position: absolute;
    width: 70px;
    height: 70px;
}

.left { top: -28px; left: -28px; }
.right { top: -28px; right: -28px; }

.face {
    width: 140px;
    height: 140px;
    position: relative;
}


@keyframes appear {
    0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    70% { opacity: 1; transform: scale(1.05) rotate(5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

@keyframes glow {
    0% { opacity: 0; }
    100% { opacity: 1; }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); filter: drop-shadow(0 0 15px rgba(255,182,193,0.3)); }
}


.text {
    width: 85%;
    max-width: 600px;
    color: rgba(255,255,255,0.95);
    text-align: center;
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 45px; /* مسافة متناسقة قبل الاسم */
    opacity: 0;
    font-weight: 300;
    animation: textIn 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    animation-delay: 2.2s;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

@keyframes textIn {
    from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
}


.name {
    text-align: center;
    opacity: 0;
    font-size: 16px;
    letter-spacing: 1px;
    font-weight: 400;
    color: rgba(255,255,255,0.4);
    animation: showName 2s ease forwards;
    animation-delay: 5s;
}

@keyframes showName {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.name span {
    color: #ffb6c1;
    font-weight: 600;
    text-shadow: 0 0 15px rgba(255,182,193,0.6);
}


@media (max-width: 600px) {
    .text {
        font-size: 17px;
        width: 90%;
        margin-bottom: 35px;
    }
    .mickey {
        width: 110px;
        height: 110px;
        margin-bottom: 40px;
    }
    .face { width: 110px; height: 110px; }
    .ear { width: 55px; height: 55px; }
    .left { top: -22px; left: -22px; }
    .right { top: -22px; right: -22px; }
    .name { font-size: 14px; }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="mickey">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face"></div>
    </div>


    <div class="text">
    This page was built just to say: you’re truly one of a kind.<br><br>
    Thank you for being the wonderful person you are,<br>
    and I'm just really glad to have you by my side.
    </div>


    <div class="name">
    Made with love by <span>Njoud</span> for you 
    </div>
</div>

</body>
</html>

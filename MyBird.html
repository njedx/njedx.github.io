<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}


.heart{
    position:relative;
    width:140px;
    height:140px;
    background:#ffb6c1; /* baby pink */
    transform:rotate(-45deg);
    animation:beat 1.2s infinite, glow 1.5s infinite;
    box-shadow:0 0 20px #ffb6c1;
}


.heart::before,
.heart::after{
    content:"";
    position:absolute;
    width:140px;
    height:140px;
    border-radius:50%;
    background:#ffb6c1;
}

.heart::before{ top:-70px; left:0; }
.heart::after{ left:70px; top:0; }

@keyframes beat{
    0%,100%{ transform:rotate(-45deg) scale(1); }
    50%{ transform:rotate(-45deg) scale(1.15); }
}

@keyframes glow{
    0%,100%{ box-shadow:0 0 15px #ffb6c1; }
    50%{ box-shadow:0 0 40px #ffb6c1; }
}


.fall{
    position:absolute;
    top:-10px;
    color:#ffb6c1;
    font-size:18px;
    animation:drop linear infinite;
    opacity:0.8;
}

@keyframes drop{
    from{
        transform:translateY(-10vh);
    }
    to{
        transform:translateY(110vh);
    }
}


.text{
    position:absolute;
    color:white;
    margin-top:200px;
    font-size:18px;
    text-shadow:0 0 10px #ffb6c1;
}
</style>
</head>

<body>

<div class="heart"></div>
<div class="text">I LOVE YOU 💖</div>

<script>
for(let i=0;i<60;i++){
    let heart = document.createElement("div");
    heart.className = "fall";
    heart.innerHTML = "💗";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*20+10) + "px";
    heart.style.animationDuration = (Math.random()*5+3) + "s";
    heart.style.animationDelay = Math.random()*5 + "s";

    document.body.appendChild(heart);
}
</script>

</body>
</html>

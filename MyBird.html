<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mickey Love</title>

<style>
body{
    margin:0;
    height:100vh;
    background:#000;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}


.mickey{
    position:relative;
    width:140px;
    height:140px;
    background:#000;
}


.ear{
    position:absolute;
    width:70px;
    height:70px;
    background:#111;
    border-radius:50%;
    top:-30px;
}

.ear.left{ left:-30px; }
.ear.right{ right:-30px; }


.face{
    width:140px;
    height:140px;
    background:#111;
    border-radius:50%;
    position:absolute;
    top:0;
    left:0;
    box-shadow:0 0 25px #222;
}


.text{
    position:absolute;
    bottom:-100px;
    font-size:40px;
    color:#ff4da6;
    text-align:center;
    width:100%;
    animation:down 4s linear infinite;
    text-shadow:0 0 15px #ff4da6;
    font-weight:bold;
}


@keyframes down{
    0%{ transform:translateY(-200px); opacity:0; }
    30%{ opacity:1; }
    100%{ transform:translateY(400px); opacity:0; }
}
</style>
</head>

<body>

<div class="mickey">
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face"></div>
</div>

<div class="text">
    I LOVE YOU ❤️ I LOVE YOU ❤️ I LOVE YOU ❤️
</div>

</body>
</html>
